services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wikiself}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespw}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wikiself}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-wikiself};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgrespw}
      Jwt__Secret: ${JWT_SECRET:-Hk4p4Q5mDHaw6mNLoy83cVVZ4FiA9wMpELp3p4BEmQjYkpDoJ9ihbPWfKxxiEWHa38A9gWNVAzvg8JB6x8uJfA==}
      Jwt__Issuer: WikiSelf
      Jwt__Audience: WikiSelfClient
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:-http://localhost:8082}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_assets:/app/AssetStorage
    expose:
      - "7000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:8082:8082"
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
  backend_assets:
